function searchResults() {
  const q = state.search;
  const terms = q.q.toLowerCase().split(/\s+/).filter(Boolean);
  const out = [];
  for (const e of byId.search || []) {
    if (q.kind === "operations" && e.kind !== "operation") continue;
    if (q.kind === "resources" && e.kind !== "resource") continue;
    if (q.kind === "shapes" && (e.kind === "operation" || e.kind === "resource")) continue;
    if (q.type && (e.kind !== "shape" || (q.type === "simple" ? !SIMPLE_TYPES.has(e.type) : e.type !== q.type))) continue;
    if (q.changed && e.kind !== "removed" && !edited(e.anchors)) continue;

    // Error shapes only: every operation lists the service's errors, so operations would always match.
    if (q.errors && !(e.kind === "shape" && e.error)) continue;
    let score = 0;
    let hit = null;

      const m = termScore(e.fields, t);

      score += m.score;

/**
 * Validation events by what the page lists: errors (ERROR, DANGER) and warnings, which are listed,
 * and notes and suppressed events, which are counted and shown on request. Every count the page
 * shows uses these.
 */
function validationCounts() {
  const v = state.api.validation || {};
  const events = v.events || [];
  const counts = v.counts;
  const n = (sev) => (counts ? counts[sev] || 0 : events.filter((e) => e.severity === sev).length);
  const errors = n("ERROR") + n("DANGER");
  const warnings = n("WARNING");
  // Without per-severity counts, everything beyond the listed events counts as notes.
  const notes = counts ? n("NOTE") : Math.max(0, (v.eventCount || 0) - events.length);
  const suppressed = counts ? n("SUPPRESSED") : 0;
  return { errors, warnings, listed: errors + warnings, notes, suppressed, hidden: notes + suppressed };
}

function plural(n, word, many = `${word}s`) {
  return `${n} ${n === 1 ? word : many}`;
}

/** "3 notes and 6 suppressed events", for the events the page does not list. */
function hiddenEvents(vc) {
  return [vc.notes && plural(vc.notes, "note"), vc.suppressed && plural(vc.suppressed, "suppressed event")].filter(Boolean).join(" and ");
}

/** "2 errors · 1 warning", or "No warnings or errors", plus the notes and suppressed events not listed. */
function validationSummary(vc, v = {}) {
  const parts = [vc.errors && plural(vc.errors, "error"), vc.warnings && plural(vc.warnings, "warning")].filter(Boolean);
  return (parts.length ? parts.join(" · ") : v.valid === false ? "The model does not load" : "No warnings or errors")
    + (vc.hidden ? ` · ${hiddenEvents(vc)} not listed` : "");
}

/** One validation event as a table row: severity, event id with its shape and source, and message. */
function eventRow(e) {
  return h("tr", {},
    h("td", {}, h("span", { class: "badge sm tint " + (e.severity === "WARNING" ? "warn" : e.severity === "NOTE" || e.severity === "SUPPRESSED" ? "neutral" : "danger") }, severityLabel(e.severity))),
    h("td", { class: "member" }, idBreaks(e.id),
      e.shapeId && h("div", { class: "sub" }, byId.owner[e.shapeId]
        ? h("button", { class: "link mono", onclick: () => go(byId.owner[e.shapeId]) }, idBreaks(e.shapeId))
        : idBreaks(e.shapeId)),
      e.source && h("div", { class: "sub", title: `${e.source.file}:${e.source.line}` }, idBreaks(`${shortSource(e.source.file)}:${e.source.line}`))),
    h("td", {}, richMessage(e.message),

}

/** Text with a break opportunity after each ".", "#", "$", and "/", so IDs and paths wrap between parts only. */
function idBreaks(text) {
  return String(text).split(/(?<=[.#$/])/).flatMap((part, i) => (i > 0 ? [h("wbr"), part] : [part]));

/** A dependency jar's source as "<jar>!/…/<file>"; the full jar:file:// path goes in a title. */
function shortSource(file) {
  const m = /^jar:.*?([^/]+\.jar)!\/(?:.*\/)?([^/]+)$/.exec(String(file));
  return m ? `${m[1]}!/…/${m[2]}` : String(file);

/** Fixed columns, so long event ids, shape ids, and jar paths wrap rather than squeeze the message. */
function eventTable(events) {

    h("colgroup", {}, h("col", { class: "sev" }), h("col", { class: "ev" }), h("col", {})),

function validationReference() {

// ── Example request: example picker, request editor, validation hints, and response ───────────

/** The operation's example request choice: a modeled example ("ex:<i>") or a generated sample ("gen:required" | "gen:all"). */
function tryChoice(o) {
  const c = state.exampleChoice[o.id];
  const examples = o.examples || [];
  if (c === "gen:required" || c === "gen:all") return c;
  if (c && c.startsWith("ex:") && examples[+c.slice(3)]) return c;
  return examples.length > 0 ? "ex:0" : "gen:required";
}

/** The modeled example a choice names, or null for a generated sample. */
function exampleOf(o, choice) {
  return choice.startsWith("ex:") ? (o.examples || [])[+choice.slice(3)] || null : null;
}

/** The editor JSON a choice loads. */
function choiceValue(o, choice) {
  const ex = exampleOf(o, choice);
  if (ex) return JSON.stringify(ex.input || {}, null, 2);
  const input = o.input && byId.shapes[o.input];
  return JSON.stringify(input ? sample(input, { mode: choice === "gen:all" ? "all" : "required" }) : {}, null, 2);
}

/** Loads an example or a generated sample into the editor and re-renders only the example request box. */
function loadChoice(o, choice) {
  state.exampleChoice[o.id] = choice;
  state.values[o.id] = choiceValue(o, choice);
  state.loadedValue[o.id] = state.values[o.id];
  renderTryIt(o);
}

/** Replaces the example request box, so the reference around it keeps its scroll position and focus. */
function renderTryIt(o, focusId) {

    (o.examples || []).length > 0 && h("optgroup", { label: "Modeled examples" },
      o.examples.map((x, i) => h("option", { value: `ex:${i}` }, (x.title || `Example ${i + 1}`) + (x.error ? " (error)" : "")))),
    h("optgroup", { label: "Generated" },
      h("option", { value: "gen:required" }, "Required members"),
      h("option", { value: "gen:all" }, "All members")));
  picker.value = choice;

  const editedEl = h("span", { class: "badge sm neutral", hidden: true });
  const lenient = !!(ex && ex.allowConstraintErrors);
  let good = parseJson(state.values[o.id]).value ?? {};

  // The request editor: a line-number gutter beside the JSON textarea.
  const gutter = h("pre", { class: "gutter", "aria-hidden": "true" });
  const editor = h("textarea", {
    class: "json", spellcheck: "false", wrap: "off", "aria-label": "Request JSON", autocapitalize: "off", autocomplete: "off",
    id: `try-json-${sid}`,
    oninput: (e) => { state.values[o.id] = e.target.value; syncGutter(); clearTimeout(requestCards.timer); requestCards.timer = setTimeout(update, 150); },
    onscroll: () => { gutter.scrollTop = editor.scrollTop; },
  });
  editor.value = state.values[o.id];
  const editorBox = h("div", { class: "editor" }, gutter, editor);
  const syncGutter = () => {
    const n = editor.value.split("\n").length;
    if (gutter.childElementCount !== n) setChildren(gutter, Array.from({ length: n }, (_, i) => h("div", {}, String(i + 1))));
    editor.rows = Math.min(Math.max(n + 1, 6), 18);
    gutter.scrollTop = editor.scrollTop;
  };
  syncGutter();
  const errorEl = h("div", { class: "json-error" });
  const hintsEl = h("ul", { class: "hints", "aria-label": "Request checks" });
  const countEl = h("span", { class: "badge sm", hidden: true, id: `try-count-${sid}` });

  // The response: the example's output or error, or a sample of the output shape.
  const responseLabel = h("span", { class: "hint tryit-section-aside" });
  const responseView = h("pre", { class: "codeview", tabindex: "0", "aria-label": "Response JSON", id: `try-response-${sid}` });
  const fillResponse = () => {
    const r = tryResponse(o, ex);

    responseView.textContent = r.text;
  };
  const copyButton = (what, value) => h("button", { class: "btn sm tab-copy", onclick: () => copy(value(), what),
    "aria-label": `Copy ${what}`, title: `Copy ${what}` }, icon("copy"), h("span", { class: "copy-label" }, "Copy"));

  // Re-checks the editor JSON: parse errors, the hints list, the error count, and the response.
  const update = () => {
    const parsed = parseJson(state.values[o.id]);
    editorBox.classList.toggle("invalid", !!parsed.error);
    setChildren(errorEl, parsed.error && h("div", { class: "alert error", role: "alert" }, h("div", { class: "alert-body" },
      h("span", { class: "alert-title" }, "Invalid JSON: "), parsed.error)));
    if (!parsed.error) good = parsed.value;
    const issues = parsed.error ? [] : requestHints(o, input, good, { lenient, generated: choice.startsWith("gen:") && state.values[o.id] === state.loadedValue[o.id], choice });
    setChildren(hintsEl, issues.map((x) => hintRow(o, x)));
    hintsEl.hidden = issues.length === 0;

    const warnings = issues.filter((x) => x.severity === "warning").length;

    countEl.className = "badge sm " + (errors > 0 ? "danger" : "warn");
    countEl.textContent = errors > 0 ? plural(errors, "error") : plural(warnings, "warning");
    const edited = ex && state.values[o.id] !== state.loadedValue[o.id];
    editedEl.hidden = !edited;
    editedEl.textContent = edited ? `Edited from "${ex.title || "example"}"` : "";

  const box = h("div", { class: "tryit-box" },
    h("div", { class: "tryit-head" },

      h("button", { class: "btn", title: "Reload the chosen example or sample", onclick: () => loadChoice(o, choice) }, "Reset")),
    h("p", { class: "hint tryit-note" }, "Edit the request to check it against the model's constraints. Nothing is sent."),
    (ex || lenient) && h("div", { class: "tryit-ex" },
      ex && ex.documentation && docs(ex.documentation, true),
      h("div", { class: "tryit-flags" },
        lenient && h("span", { class: "badge sm warn", title: "The example sets allowConstraintErrors: constraint violations are expected" }, "Intentionally invalid input"),
        ex && ex.error && h("span", { class: "badge sm danger" }, `Returns ${short(ex.error.shapeId)}`),
        editedEl)),
    h("section", { class: "tryit-section", id: `try-request-${sid}`, "aria-label": "Request" },
      h("div", { class: "tryit-section-head" },
        h("h3", {}, "Request"), input && h("span", { class: "hint tryit-section-aside" }, input.name), countEl,
        copyButton("request JSON", () => state.values[o.id])),
      editorBox, errorEl, hintsEl),
    h("section", { class: "tryit-section", id: `try-response-section-${sid}`, "aria-label": "Response" },
      h("div", { class: "tryit-section-head" },
        h("h3", {}, "Response"), responseLabel,
        copyButton("response JSON", () => responseView.textContent)),
      responseView));

/** JSON.parse with a "line L, column C" location on failure. */
function parseJson(text) {
  try {
    return { value: JSON.parse(text && text.trim() ? text : "{}") };
  } catch (e) {
    const msg = String(e.message || e);
    let line, col;
    const lc = /line (\d+) column (\d+)/.exec(msg);
    const pos = /position (\d+)/.exec(msg);
    if (lc) { line = +lc[1]; col = +lc[2]; }
    else {
      // Without a position (an unexpected end), point at the end of the text.
      const at = pos ? +pos[1] : text.length;
      const before = text.slice(0, at).split("\n");
      line = before.length; col = before[before.length - 1].length + 1;
    }
    const reason = msg.replace(/^JSON\.parse: /, "").replace(/\s*\(line \d+ column \d+\)/, "").replace(/ in JSON at position \d+/, "")
      .replace(/ at line \d+ column \d+ of the JSON data/, "");
    return { error: `${reason} (line ${line}, column ${col})` };
  }
}

/** Constraint checks on the editor value, plus notes from the sample generator. */
function requestHints(o, input, value, { lenient, generated, choice }) {
  const out = [];
  if (input) validateValue(input, value, "", out, { lenient });
  if (generated && input) {
    const ctx = { mode: choice === "gen:all" ? "all" : "required", hints: [] };
    sample(input, ctx);
    for (const x of ctx.hints) if (!out.some((y) => y.path === x.path && y.message === x.message)) out.push(x);
  }
  const rank = { error: 0, warning: 1, info: 2 };
  return out.sort((a, b) => rank[a.severity] - rank[b.severity]);
}

function hintRow(o, x) {
  const label = { error: "Error", warning: "Warning", info: "Info" }[x.severity];
  const tone = { error: "danger", warning: "warn", info: "neutral" }[x.severity];
  return h("li", { class: x.severity },
    h("span", { class: `badge sm tint ${tone}` }, label),
    x.path && h("button", { class: "h-path", title: x.memberId ? `Show ${short(x.memberId)}` : null,
      onclick: () => jumpToMember(x.memberId) }, x.path),
    h("span", { class: "h-msg" }, x.message));
}

/** Scrolls to a member's reference row: on this page when it is listed here, otherwise on its shape's page. */
function jumpToMember(memberId) {
  if (!memberId) return;
  if (!document.getElementById(`row-${cssId(memberId)}`)) {
    const owner = memberId.split("$")[0];
    if (!byId.shapes[owner]) return;
    go({ kind: "shape", id: owner }, { focus: false });
  }
  flashRow(memberId);
}


// ── Responses and modeled examples ─────────────────────────────────────────────────────────────

/** The response: the chosen example's output or error, or a sample of the output shape, as JSON. */
function tryResponse(o, ex) {
  const output = o.output && byId.shapes[o.output];
  const json = (v) => JSON.stringify(v ?? {}, null, 2);
  if (ex && ex.output) return { label: `From example "${ex.title || "example"}"`, text: json(ex.output) };
  if (ex && ex.error) {
    const e = byId.shapes[ex.error.shapeId] || { id: ex.error.shapeId, name: short(ex.error.shapeId) };
    return { label: `From example "${ex.title || "example"}": error ${e.name}`, text: json(ex.error.content) };
  }
  // The request's top-level identifiers, so the response describes the resource the request names.
  let known = {};
  try {
    const req = JSON.parse(state.values[o.id] || "{}");
    if (req && typeof req === "object") known = Object.fromEntries(Object.entries(req).filter(([k, v]) => /Id$/.test(k) && typeof v === "string"));
  } catch { /* an invalid request leaves the response generated alone */ }
  return {
    label: output ? `Generated from ${output.name}` : "The operation returns no output.",
    text: json(output ? sample(output, { mode: "all", knownIds: known }) : {}),
  };
}

/** The anchor slug for an example title. */
function exampleSlug(title) {
  return String(title || "example").toLowerCase().trim().replace(/\s+/g, "-");
}

/** Modeled examples on the operation page: a sample request and response each. */
function examplesSection(o) {
  return (o.examples || []).map((ex, i) => h("div", { class: "example", id: `ex-${cssId(o.id)}-${exampleSlug(ex.title)}` },
    h("div", { class: "example-head" }, h("h3", {}, ex.title || `Example ${i + 1}`),
      ex.allowConstraintErrors && h("span", { class: "badge sm warn" }, "Intentionally invalid input"),
      h("button", { class: "btn link sm", onclick: () => {
        loadChoice(o, `ex:${i}`);
        const el = document.getElementById("sec-tryit");
        if (el) el.scrollIntoView({ block: "start", behavior: scrollBehavior() });
        const ed = document.getElementById(`try-json-${cssId(o.id)}`);
        if (ed) ed.focus({ preventScroll: true });
      } }, "Open as example request")),
    docs(ex.documentation, true),
    h("div", { class: "ex-label" }, "Input"),
    h("pre", { class: "codeview", tabindex: "0" }, JSON.stringify(ex.input || {}, null, 2)),
    h("div", { class: "ex-label" }, ex.error ? "Error" : "Output"),
    h("pre", { class: "codeview", tabindex: "0" }, tryResponse(o, ex).text)));
}

// ── Constraint-aware samples ───────────────────────────────────────────────────────────────────

const NUMERIC = new Set(["byte", "short", "integer", "long", "float", "double", "bigInteger", "bigDecimal", "intEnum"]);
const INTEGER = new Set(["byte", "short", "integer", "long", "bigInteger", "intEnum"]);
const COMPOUND = new Set(["structure", "union", "list", "set", "map", "document"]);

/** A member's or shape's target shape and type. */
function shapeInfo(el) {
  if (el && el.type !== undefined && el.target === undefined) return { target: el, type: el.type, member: null };
  const target = el && byId.shapes[el.target];
  return { target, type: target ? target.type : (el && el.targetType), member: el };
}

function hasTrait(s, id) {
  return !!(s && (s.traits || []).some((t) => t.id === id));
}

function isUnit(m) {
  return m && m.target === "smithy.api#Unit";
}

/**
 * A sample value for a member or shape that satisfies its constraints. ctx: { mode: required | all,
 * maxDepth, hints }; hints collects notes (defaults used, recursion, unmatched patterns).
 */
function sample(el, ctx = {}) {
  const c = { mode: "required", depth: 0, stack: new Set(), maxDepth: 4, hints: [], path: "", ...ctx };
  return sampleOf(el, c);
}

function sampleOf(el, ctx) {
  const { target, type, member } = shapeInfo(el);
  const note = (message) => ctx.hints.push({ path: ctx.path, memberId: member && member.id, severity: "info", message });
  if (member && member.default !== undefined && member.default !== null) {
    note(h("span", {}, "Uses the default ", h("code", {}, JSON.stringify(member.default))));
    return JSON.parse(JSON.stringify(member.default));
  }
  if (member && member.idempotencyToken) return uuid();
  if (ctx.depth > ctx.maxDepth) return neutral(type);
  const child = (m, path) => sampleOf(m, { ...ctx, depth: ctx.depth + 1, path, parentName: member ? member.name : target && target.name });
  const at = (name) => (ctx.path ? `${ctx.path}.${name}` : name);
  switch (type) {
    case "structure": {
      const out = {};
      if (!target) return out;
      ctx.stack.add(target.id);
      for (const x of target.members || []) {
        if (x.binding && x.binding.location === "responseCode") continue;
        if (ctx.mode !== "all" && (!x.required || x.idempotencyToken)) continue;
        if (ctx.stack.has(x.target)) {
          if (!x.required) continue;
          out[x.name] = {};
          ctx.hints.push({ path: at(x.name), memberId: x.id, severity: "info", message: "Recursive member: left empty" });
          continue;
        }
        out[x.name] = child(x, at(x.name));
      }
      ctx.stack.delete(target.id);
      linkIds(target, out, ctx.knownIds);
      return out;
    }
    case "union": {
      if (!target) return {};
      const ms = target.members || [];
      const pick = ms.find((x) => !x.deprecated && !ctx.stack.has(x.target)) || ms.find((x) => !x.deprecated) || ms[0];
      if (!pick) return {};
      ctx.stack.add(target.id);
      const v = isUnit(pick) ? {} : child(pick, at(pick.name));
      ctx.stack.delete(target.id);
      return { [pick.name]: v };
    }
    case "list": case "set": {
      const m = target && (target.members || [])[0];
      if (!m || ctx.stack.has(m.target)) return [];
      const c = member ? effectiveConstraints(member) : (target.constraints || {});
      const n = Math.min(Math.max(1, (c.length || {}).min || 0), 50);
      const unique = type === "set" || c.uniqueItems;
      const items = [];
      for (let i = 0; i < n; i++) {
        let v = child(m, `${ctx.path}[${i}]`);
        if (unique && i > 0) v = typeof v === "number" ? v + i : typeof v === "string" ? `${v}-${i}` : v;
        items.push(v);
      }
      return items;
    }
    case "map": {
      const key = target && (target.members || []).find((x) => x.name === "key");
      const value = target && (target.members || []).find((x) => x.name === "value");
      const c = member ? effectiveConstraints(member) : ((target && target.constraints) || {});
      const n = Math.min(Math.max(1, (c.length || {}).min || 0), 50);
      const out = {};
      if (!value || ctx.stack.has(value.target)) return out;
      for (let i = 0; i < n; i++) {
        const base = key ? sampleOf(key, { ...ctx, depth: ctx.depth + 1, parentName: member ? member.name : target.name }) : "key";
        const k = i === 0 ? base : `${base}-${i}`;
        out[k] = child(value, `${ctx.path}["${k}"]`);
      }
      return out;
    }
    case "enum": {
      const vs = ((target && target.values) || []);
      const v = vs.find((x) => !x.deprecated) || vs[0];
      return v ? (v.value ?? v.name) : "";
    }
    case "intEnum": {
      const vs = ((target && target.values) || []);
      const v = vs.find((x) => !x.deprecated) || vs[0];
      return v ? v.value : 0;
    }
    case "boolean": return false;
    case "blob": return member && member.binding && member.binding.location === "payload" ? "example" : "ZXhhbXBsZQ==";
    case "timestamp": return "2026-10-15T12:00:00Z";
    case "document": return {};
    case "string": {
      const c = member ? effectiveConstraints(member) : (target.constraints || {});
      if (target && target.values) { const v = target.values.find((x) => !x.deprecated) || target.values[0]; if (v) return v.value ?? v.name; }
      const failed = [];
      const named = member && ["member", "key", "value"].includes(member.name) && ctx.parentName
        ? { ...member, name: ctx.parentName.replace(/(ies)$/, "y").replace(/([^s])s$/, "$1") + (member.name === "member" ? "" : capitalize(member.name)) }
        : member || target;
      const s = stringSample(named, c, failed);
      if (failed.length) note(h("span", {}, "Could not generate a value matching the pattern ", h("code", {}, c.pattern)));
      return s;
    }
    default: {
      if (NUMERIC.has(type)) {
        const c = member ? effectiveConstraints(member) : ((target && target.constraints) || {});
        const r = c.range || {};
        const base = INTEGER.has(type) ? 10 : 1.5;
        let v = Math.min(Math.max(base, r.min ?? -Infinity), r.max ?? Infinity);
        if (INTEGER.has(type) && !Number.isInteger(v)) v = Math.ceil(v);
        return v;
      }
      if (type === undefined) return {};
      return stringSample(member || target || {}, member ? effectiveConstraints(member) : {});
    }
  }
}

/**
 * Makes a sample read as one call: an "<x>Id" member echoes the request's identifier, and an
 * "<x>Arn" ends in the "<x>Id" beside it (or the request's), when the member's constraints allow.
 */
function linkIds(target, out, known = {}) {
  const fits = (m, v) => {
    const c = effectiveConstraints(m);
    const len = c.length || {};
    if (codeLength(v) < (len.min ?? 0) || codeLength(v) > (len.max ?? Infinity)) return false;
    try { return !c.pattern || compilePattern(c.pattern).test(v); } catch { return true; }
  };
  for (const m of target.members || []) {
    if (/Id$/.test(m.name) && typeof out[m.name] === "string" && typeof known[m.name] === "string" && fits(m, known[m.name])) out[m.name] = known[m.name];
  }
  for (const m of target.members || []) {
    const arn = /^(.*)Arn$/.exec(m.name);
    if (!arn || typeof out[m.name] !== "string" || !/^arn:/.test(out[m.name])) continue;
    const id = out[`${arn[1]}Id`] ?? known[`${arn[1]}Id`];
    if (typeof id !== "string" || !id) continue;
    const linked = out[m.name].replace(/[^/:]+$/, id);
    if (fits(m, linked)) out[m.name] = linked;
  }
}

/** The neutral value of a type, used past the sample depth limit. */
function neutral(type) {
  if (NUMERIC.has(type)) return 0;
  if (type === "boolean") return false;
  if (type === "list" || type === "set") return [];
  if (COMPOUND.has(type)) return {};
  if (type === "timestamp") return "2026-10-15T12:00:00Z";
  return "";
}

function uuid() {
  return (crypto.randomUUID && crypto.randomUUID()) || "6f0c2a8e-7f3b-4b8e-9c1d-2e5a0b7d9f10";
}

/** Code points, as Smithy @length counts strings. */
function codeLength(s) {
  return [...s].length;
}

function kebab(s) {
  return String(s || "").replace(/([a-z0-9])([A-Z])/g, "$1-$2").toLowerCase().replace(/[^a-z0-9-]/g, "");
}

/** A string for a member or shape that satisfies its length and pattern; `failed` collects a miss. */
function stringSample(el, c = {}, failed) {
  const name = (el && el.name) || "value";
  const len = c.length || {};
  const min = len.min ?? 0, max = len.max ?? Infinity;
  const svc = (state.api && state.api.service) || {};
  try {
    if (c.pattern) {
      const s = patternSample(c.pattern, { min, max, hint: name, signingName: svc.sigv4Name || "" });
      if (s != null) return s;
      if (failed) failed.push(c.pattern);
      return `example-${name}`;
    }
  } catch {
    if (failed) failed.push(c.pattern);
    return `example-${name}`;
  }
  const candidates = hintCandidates(name, fillerFor(name), "", svc.sigv4Name || "");
  for (const s of candidates) if (codeLength(s) >= min && codeLength(s) <= max) return s;
  const filler = fillerFor(name) || "example";
  let s = candidates[0] || filler;
  while (codeLength(s) < min) s += filler;
  return [...s].slice(0, Math.max(min, Math.min(max, codeLength(s)))).join("");
}

/** The region of every generated request, endpoint, signature, and ARN, so a sample reads as one call. */
const SAMPLE_REGION = "us-east-1";

function fillerFor(name) {
  return kebab(String(name).replace(/(Arn|Id|ID)$/, "")) || "example";
}

/** The pattern compiled as ECMA 262 with the u flag, or without it when the u flag rejects it. */
function compilePattern(p) {
  try { return new RegExp(p, "u"); } catch { return new RegExp(p); }
}

/** A string matching a Smithy @pattern (ECMA 262, unanchored) within [min, max] code points, or null. */
function patternSample(pattern, { min = 0, max = Infinity, hint = "", signingName = "" } = {}) {
  let re;
  try { re = compilePattern(pattern); } catch { return null; }
  const ok = (s) => s != null && re.test(s) && codeLength(s) >= min && codeLength(s) <= max;
  const filler = fillerFor(hint);
  for (const s of hintCandidates(hint, filler, pattern, signingName)) if (ok(s)) return s;
  for (const reps of [null, 8, min, Math.max(min, 1) * 2]) {
    let s;
    try { s = synthesize(pattern, filler, reps); } catch { s = null; }
    if (ok(s)) return s;
    if (s != null && codeLength(s) < min) {
      const padded = s + filler.repeat(Math.ceil(min / filler.length));
      if (ok(padded)) return padded;
    }
  }
  return null;
}

/** Name- and pattern-shaped guesses: ARNs, IDs, tokens, and readable words. */
function hintCandidates(name, filler, pattern, signingName) {
  const n = String(name).toLowerCase();
  const out = [];
  if (n.endsWith("arn") || /^\^?arn:/.test(pattern)) {
    // ARN-shaped: try the literal words the pattern names (service, resource type) in the usual layout.
    const words = [...new Set((pattern.match(/[a-z][a-z0-9-]{2,}/g) || []).filter((w) => !["arn", "aws"].includes(w)))];
    const services = [...new Set([...words, signingName || "service"].filter(Boolean))];
    for (const svcWord of services) {
      const resources = [...new Set([...words.filter((w) => w !== svcWord), filler, "resource"])];
      for (const res of resources) for (const sep of ["/", ":"]) out.push(`arn:aws:${svcWord}:${SAMPLE_REGION}:123456789012:${res}${sep}${filler}`);
    }
  }
  if (n.endsWith("id")) out.push("a1b2c3d4e5f6", "a1b2c3d4-5678-90ab-cdef-EXAMPLE11111");
  if (/token/.test(n)) out.push("6f0c2a8e-7f3b-4b8e-9c1d-2e5a0b7d9f10");
  out.push(`my-${filler}`, filler, `example-${filler}`, `my${filler.replace(/-/g, "")}`);
  return out;
}

/**
 * A tiny regex walker for the subset models use: literals, escapes, classes, groups, |, and
 * quantifiers. `reps` sets how many times an open-ended class repeats (null: as few as allowed).
 */
function synthesize(pattern, filler, reps) {
  const src = pattern;
  let i = 0, fi = 0;
  const nextFill = (allowed) => {
    // Prefer the filler's characters, so the output reads like the member name.
    for (let k = 0; k < filler.length; k++) {
      const ch = filler[(fi + k) % filler.length];
      if (allowed(ch)) { fi = (fi + k + 1) % filler.length; return ch; }
    }
    for (const ch of "abcxyz1234567890ABCXYZ-_.:/") if (allowed(ch)) return ch;
    for (let code = 33; code < 127; code++) if (allowed(String.fromCharCode(code))) return String.fromCharCode(code);
    return "a";
  };
  const escTest = (e) => ({
    d: (ch) => /\d/.test(ch), w: (ch) => /\w/.test(ch), s: (ch) => ch === " ", D: (ch) => !/\d/.test(ch),
    W: (ch) => !/\w/.test(ch), S: (ch) => ch !== " ",
  })[e];
  const lazy = () => { if (src[i] === "?") i++; };
  const quant = () => {
    const ch = src[i];
    if (ch === "*") { i++; lazy(); return [0, Infinity]; }
    if (ch === "+") { i++; lazy(); return [1, Infinity]; }
    if (ch === "?") { i++; lazy(); return [0, 1]; }
    if (ch === "{") {
      const m = /^\{(\d+)(,(\d*))?\}/.exec(src.slice(i));
      if (m) { i += m[0].length; lazy(); return [+m[1], m[2] ? (m[3] ? +m[3] : Infinity) : +m[1]]; }
    }
    return [1, 1];
  };
  const classAtom = () => {
    const start = i - 1;
    while (i < src.length && src[i] !== "]") { if (src[i] === "\\") i++; i++; }
    i++;
    const re = compilePattern(src.slice(start, i));
    return { cls: true, gen: () => nextFill((ch) => re.test(ch)) };
  };
  const parseAtom = () => {
    const ch = src[i++];
    if (ch === "^" || ch === "$") return null;
    if (ch === "(") {
      if (src[i] === "?") { i++; if (src[i] === "<") { while (i < src.length && src[i] !== ">") i++; } i++; }
      const sub = alt();
      i++;
      return { gen: () => sub };
    }
    if (ch === "[") return classAtom();
    if (ch === ".") return { cls: true, gen: () => nextFill((x) => x !== "\n") };
    if (ch === "\\") {
      const e = src[i++];
      const t = escTest(e);
      if (t) return { cls: true, gen: () => nextFill(t) };
      if (e === "u" && /^[0-9a-fA-F]{4}/.test(src.slice(i))) { const code = parseInt(src.slice(i, i + 4), 16); i += 4; return { gen: () => String.fromCharCode(code) }; }
      return { gen: () => e };
    }
    return { gen: () => ch };
  };
  function seq() {
    const out = [];
    while (i < src.length && src[i] !== "|" && src[i] !== ")") {
      const atom = parseAtom();
      if (atom == null) continue;
      const [lo, hi] = quant();
      let n = lo;
      if (atom.cls && hi > lo) n = reps == null ? (lo === 0 ? Math.min(hi, 8) : lo) : Math.min(hi, Math.max(lo, reps));
      for (let k = 0; k < n; k++) out.push(atom.gen());
    }
    return out.join("");
  }
  function alt() {
    const branches = [seq()];
    while (src[i] === "|") { i++; branches.push(seq()); }
    return branches[0];
  }
  return alt();
}

// ── Request validation ─────────────────────────────────────────────────────────────────────────

function levenshtein(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) {
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  }
  return d[a.length][b.length];
}

/** The closest member name to an unknown key: a case-insensitive match, or one within 2 edits. */
function didYouMean(key, names) {
  const lower = key.toLowerCase();
  const exact = names.find((n) => n.toLowerCase() === lower);
  if (exact) return exact;
  let best = null, bestD = 3;
  for (const n of names) { const d = levenshtein(key, n); if (d < bestD) { best = n; bestD = d; } }
  return best;
}

function typeName(v) {
  return v === null ? "null" : Array.isArray(v) ? "array" : typeof v;
}

/**
 * Checks a parsed editor value against a shape or member and pushes { path, memberId, severity,
 * message } issues. With lenient (an example that sets allowConstraintErrors) constraint
 * violations are info rather than errors.
 */
function validateValue(el, value, path, out, opts = {}) {
  const { target, type, member } = shapeInfo(el);
  const memberId = member ? member.id : null;
  const where = path || (target ? target.name : "");
  const push = (severity, message) => out.push({ path: where, memberId, severity, message });
  const constraint = (message) => push(opts.lenient ? "info" : "error", message);
  const mismatch = (expected) => push("error", `Expected ${expected}, got ${typeName(value)}`);
  if (value === undefined) return;
  const c = member ? effectiveConstraints(member) : ((target && target.constraints) || {});
  const len = c.length;
  const checkLength = (n, unit) => {
    if (!len) return;
    if (len.min !== undefined && n < len.min) constraint(`Minimum length: ${len.min} ${unit}`);
    if (len.max !== undefined && n > len.max) constraint(`Maximum length: ${len.max} ${unit}`);
  };
  const plainObject = value !== null && typeof value === "object" && !Array.isArray(value);
  const at = (name) => (path ? `${path}.${name}` : name);
  switch (type) {
    case "structure": case "union": {
      if (!plainObject) return mismatch("an object");
      const ms = (target && target.members) || [];
      const names = ms.map((m) => m.name);
      for (const key of Object.keys(value)) {
        if (names.includes(key)) continue;
        const guess = didYouMean(key, names);
        out.push({ path: at(key), memberId, severity: "warning",
          message: guess ? `Unknown member. Did you mean ${guess}?` : `Unknown member of ${target ? target.name : "the structure"}` });
      }
      if (type === "union") {
        const set = ms.filter((m) => value[m.name] !== undefined && value[m.name] !== null);
        if (set.length !== 1) push("error", `Set exactly one of: ${names.join(" | ")}`);
      }
      for (const m of ms) {
        const v = value[m.name];
        if (v === undefined || v === null) {
          if (type === "structure" && m.required && !m.idempotencyToken && !(m.binding && m.binding.location === "responseCode")) {
            if (m.default !== undefined && m.default !== null) {
              out.push({ path: at(m.name), memberId: m.id, severity: "info", message: `Missing; the SDK sends the default ${JSON.stringify(m.default)}` });
            } else {
              out.push({ path: at(m.name), memberId: m.id, severity: opts.lenient ? "info" : "error", message: "Missing required member" });
            }
          }
          continue;
        }
        if (isUnit(m)) continue;
        validateValue(m, v, at(m.name), out, opts);
      }
      return;
    }
    case "list": case "set": {
      if (!Array.isArray(value)) return mismatch("an array");
      checkLength(value.length, "items");
      const m = target && (target.members || [])[0];
      const sparse = hasTrait(target, "smithy.api#sparse");
      if (type === "set" || c.uniqueItems) {
        const seen = new Set(value.map((x) => JSON.stringify(x)));
        if (seen.size !== value.length) constraint("Items must be unique (@uniqueItems)");
      }
      value.forEach((x, i) => {
        if (x === null) { if (!sparse) out.push({ path: `${where}[${i}]`, memberId, severity: "error", message: "null is not allowed; the list is not @sparse" }); return; }
        if (m) validateValue(m, x, `${where}[${i}]`, out, opts);
      });
      return;
    }
    case "map": {
      if (!plainObject) return mismatch("an object");
      checkLength(Object.keys(value).length, "entries");
      const k = target && (target.members || []).find((x) => x.name === "key");
      const v = target && (target.members || []).find((x) => x.name === "value");
      const sparse = hasTrait(target, "smithy.api#sparse");
      for (const [key, x] of Object.entries(value)) {
        const p = `${where}["${key}"]`;
        if (k) validateValue(k, key, `${p} (key)`, out, opts);
        if (x === null) { if (!sparse) out.push({ path: p, memberId, severity: "error", message: "null is not allowed; the map is not @sparse" }); continue; }
        if (v) validateValue(v, x, p, out, opts);
      }
      return;
    }
    case "document": return;
    case "boolean": if (typeof value !== "boolean") mismatch("a boolean"); return;
    case "timestamp": {
      if (typeof value === "number") return;
      if (typeof value !== "string" || Number.isNaN(Date.parse(value))) push("error", "Not a timestamp. Use ISO 8601, as in 2026-10-15T12:00:00Z, or epoch seconds");
      return;
    }
    case "blob": {
      if (typeof value !== "string") return mismatch("a base64 string");
      const raw = member && (member.streaming || (member.binding && member.binding.location === "payload"));
      if (!raw && (!/^[A-Za-z0-9+/]*={0,2}$/.test(value) || value.length % 4 !== 0)) push("error", "Not valid base64");
      if (!raw) checkLength(Math.floor(value.replace(/=+$/, "").length * 3 / 4), "bytes");
      return;
    }
    case "enum": case "intEnum": {
      const vs = ((target && target.values) || []).map((x) => (type === "intEnum" ? x.value : x.value ?? x.name));
      if (type === "enum" && typeof value !== "string") return mismatch("a string");
      if (type === "intEnum" && !Number.isInteger(value)) return mismatch("an integer");
      if (vs.length && !vs.includes(value)) constraint(`Must be one of: ${vs.join(" | ")}`);
      return;
    }
    default: {
      if (NUMERIC.has(type)) {
        if (typeof value !== "number") return mismatch("a number");
        if (INTEGER.has(type) && !Number.isInteger(value)) push("error", "Must be an integer");
        const r = c.range;
        if (r && r.min !== undefined && value < r.min) constraint(`Minimum: ${r.min}`);
        if (r && r.max !== undefined && value > r.max) constraint(`Maximum: ${r.max}`);
        return;
      }
      if (typeof value !== "string") return mismatch("a string");
      if (target && target.values) {
        const vs = target.values.map((x) => x.value ?? x.name);
        if (!vs.includes(value)) constraint(`Must be one of: ${vs.join(" | ")}`);
      }
      checkLength(codeLength(value), "Unicode scalar values");
      if (c.pattern) {
        let re = null;
        try { re = compilePattern(c.pattern); } catch { re = null; }
        if (re && !re.test(value)) constraint(h("span", {}, "Must match ECMA 262 regular expression ", h("code", {}, c.pattern)));
      }
    }
  }
}

// ── Changes since the baseline ───────────────────────────────────────────────────────────────────

/** Operations and shapes with an added or changed element, in display order. */
function changedElements() {
  const p = state.api;
  const ops = p.operations.filter((o) => edited(operationAnchors(o)))
    .map((o) => ({ view: { kind: "operation", id: o.id }, name: o.name, kind: changeOf(o.id) || "changed", what: "operation",
      breaking: breakingFor(operationAnchors(o)).length > 0, danger: dangerFor(operationAnchors(o)).length > 0 }));
  const shapes = Object.values(p.shapes).filter((s) => edited(shapeAnchors(s)) && !isIoShape(s))
    .sort((a, b) => a.name.localeCompare(b.name))
    .map((s) => ({ view: { kind: "shape", id: s.id }, name: s.name, kind: changeOf(s.id) || "changed", what: s.type,
      breaking: breakingFor(shapeAnchors(s)).length > 0, danger: dangerFor(shapeAnchors(s)).length > 0 }));
  return [...ops, ...shapes];
}

function isIoShape(s) {
  return state.api.operations.some((o) => o.input === s.id || o.output === s.id);
}

/** "12 added", "9 changed", "1 removed", "3 breaking", "1 danger", "2 warnings". */
function changeSummaryParts() {
  const c = state.api.changes;
  const kinds = Object.values(c.entries || {});
  const events = c.compatibility || [];
  const breaking = events.filter((e) => e.breaking).length;
  const danger = events.filter((e) => e.danger).length;
  const warnings = events.filter((e) => e.severity === "WARNING").length;
  return [`${kinds.filter((k) => k === "added").length} added`, `${kinds.filter((k) => k === "changed").length} changed`,
    `${(c.removed || []).length} removed`, breaking && `${breaking} breaking`, danger && `${danger} danger`,
    warnings && plural(warnings, "warning")].filter(Boolean);
}

/** A severity in sentence case, as badges show it: "Warning", "Note", "Danger". */
function severityLabel(sev) {
  const s = String(sev || "");
  return s.charAt(0) + s.slice(1).toLowerCase();
}

/**
 * A compatibility or validation message: `code` spans become code (shape IDs shortened, and
 * linked when the page shows them), and an inline "- [NOTE] …" list becomes list items.
 */
function richMessage(text) {
  const spans = (t) => String(t).split(/(`[^`]+`)/).filter(Boolean).map((part) => {
    if (!/^`.+`$/.test(part)) return part;
    const code = part.slice(1, -1);
    if (/^[A-Za-z0-9_.]+#[A-Za-z0-9_$]+$/.test(code)) {
      return byId.owner[code] ? elementLink(code, short(code)) : h("code", { title: code }, short(code));
    }
    return h("code", {}, code);
  }).flatMap((part) => typeof part !== "string" ? [part]
    : part.split(/(https?:\/\/[^\s<>"'`]+[^\s<>"'`.,;:!?)\]])/).filter(Boolean).map((t) => /^https?:\/\//.test(t)
      ? h("a", { href: t, class: "link", target: "_blank", rel: "noopener noreferrer" }, slashBreaks(t)) : t));
  const [lead, ...items] = String(text || "").split(/\s*(?:^|\n|\s)- \[(?=[A-Z]+\])/);
  return [spans(lead), items.length > 0 && h("ul", {}, items.map((item) => {
    const m = /^([A-Z]+)\]\s*([\s\S]*)$/.exec(item);
    return h("li", {}, m ? [h("span", { class: "hint" }, `${severityLabel(m[1])}: `), spans(m[2])] : spans(item));
  }))];
}

/** Changed elements grouped under Operations, Shapes, and Removed; the current page's row is marked. */
function changeList(limit) {
  const c = state.api.changes;
  const items = changedElements();
  const shown = limit ? items.slice(0, limit) : items;
  const row = (e) => h("li", { "aria-current": isCurrent(e.view) ? "true" : null },
    h("span", { class: `badge sm tint ${e.kind === "added" ? "ok" : "accent"}` }, e.kind === "added" ? "New" : "Changed"),
    h("a", { class: "link mono", href: hashFor(e.view), title: e.name, onclick: (ev) => { ev.preventDefault(); go(e.view); } }, e.name),
    e.breaking && h("span", { class: "badge sm tint danger", title: "Breaking change" }, "Breaking"),
    !e.breaking && e.danger && h("span", { class: "badge sm tint warn", title: DANGER_HINT }, "Danger"),
    h("span", { class: "what" }, e.what));
  const ops = shown.filter((e) => e.view.kind === "operation");
  const shapes = shown.filter((e) => e.view.kind !== "operation");
  const removed = c.removed || [];
  return [
    items.length === 0 && removed.length === 0 && h("p", { class: "hint" }, "No API changes since the baseline."),
    ops.length > 0 && h("div", { class: "change-group" },
      h("div", { class: "group-title" }, `Operations (${ops.length})`), h("ul", { class: "change-list" }, ops.map(row))),
    shapes.length > 0 && h("div", { class: "change-group" },
      h("div", { class: "group-title" }, `Shapes (${shapes.length})`), h("ul", { class: "change-list" }, shapes.map(row))),
    removed.length > 0 && h("div", { class: "change-group" }, h("div", { class: "group-title" }, `Removed (${removed.length})`), h("ul", { class: "change-list" },
      removed.map((r) => h("li", {},
        h("span", { class: "badge sm tint danger" }, "Removed"),
        h("span", { class: "removed", title: r.parent ? `${r.parent.split("#").pop()}.${r.name}` : r.name }, r.parent ? `${r.parent.split("#").pop()}.${r.name}` : r.name),
        h("span", { class: "what" }, r.type))))),
    limit > 0 && items.length > limit && h("button", { class: "btn link", onclick: () => go({ kind: "changes" }) }, `All ${items.length} changes`),
  ];
}

/**
 * A link to the page that shows a model element. When that is the page already open, it scrolls
 * to the element instead: its row, or the Request or Response section for the operation's input
 * or output; any other shape opens its own page.
 */
function elementLink(id, label) {
  const owner = byId.owner[id];
  const shapeView = byId.shapes[id] && { kind: "shape", id };
  const here = owner && isCurrent(owner);
  const href = hashFor(here && shapeView ? shapeView : owner);
  return h("a", { class: "link mono", href, title: id, onclick: (e) => {
    e.preventDefault();
    if (!isCurrent(owner)) { go(owner); return; }
    const o = state.view.kind === "operation" && byId.ops[state.view.id];
    const section = o && (id === o.input ? "sec-request" : id === o.output ? "sec-response" : null);
    if (document.getElementById(`row-${cssId(id)}`)) flashRow(id);
    else if (section) document.getElementById(section).scrollIntoView({ block: "start", behavior: scrollBehavior() });
    else if (shapeView && !isCurrent(shapeView)) go(shapeView);
    else scroller().scrollTo({ top: 0 });
  } }, label);
}

function compatibilityList(events) {
  if (events.length === 0) return h("p", { class: "hint" }, "No compatibility events: existing clients are unaffected.");
  return events.map((e) => {
    const owner = e.shapeId && byId.owner[e.shapeId];
    const name = e.shapeId && e.shapeId.split("#").pop().replace("$", ".");
    return h("div", { class: "compat" + (e.breaking ? " breaking" : e.danger ? " danger" : "") },
      h("div", { class: "sev" },
        h("span", { class: "badge sm " + (e.breaking ? "danger" : e.danger || e.severity === "WARNING" ? "warn" : "neutral"),
          title: e.breaking ? "Breaking change" : e.danger ? DANGER_HINT : null },
        e.breaking ? "Breaking" : severityLabel(e.severity)),
        e.shapeId && (owner ? elementLink(e.shapeId, name) : h("span", { class: "mono", title: e.shapeId }, name)),
        h("span", { class: "hint", style: "font-weight:400" }, e.id)),
      h("div", { class: "msg-text" }, richMessage(sentenceCase(e.message))));
  });
}

/** smithy-diff messages start lowercase ("structure shape members were…"); they read as sentences here. */
function sentenceCase(text) {
  const t = String(text || "");
  return /^[a-z]/.test(t) ? t.charAt(0).toUpperCase() + t.slice(1) : t;
}

/**
 * Non-breaking events: warnings and errors in full; notes (mostly AddedShape, which repeat the
 * API elements list) collapsed behind a disclosure.
 */
function otherCompatibility(events) {
  if (events.length === 0) return compatibilityList(events);
  const notes = events.filter((e) => e.severity === "NOTE" || e.severity === "SUPPRESSED");
  const rest = events.filter((e) => !notes.includes(e));
  const ids = [...new Set(notes.map((e) => e.id))];
  return [
    rest.length > 0 && compatibilityList(rest),
    notes.length > 0 && h("details", { class: "compat-notes" },
      h("summary", {}, `${plural(notes.length, "note")} (${ids.join(", ")})`,
        ids.every((id) => /^Added/.test(id)) && h("span", { class: "hint" }, " · the additions listed under API elements")),
      compatibilityList(notes)),
  ];
}

/** A file path as an id fragment, for diff line ids. */
function slug(path) {
  return String(path || "").replace(/[^A-Za-z0-9_-]+/g, "-");
}

/** The id of a diff line: dl-<file>-<b (baseline) | c (current)>-<line>. */
function diffLineId(path, side, line) {
  return `dl-${slug(path)}-${side === "baseline" ? "b" : "c"}-${line}`;
}


/** Re-renders the main pane in place, keeping its scroll position. */
function rerenderMain() {
  const top = scroller().scrollTop;
  const restoreFocus = focusRecord(document.activeElement);
  renderBody();
  scroller().scrollTop = top;
  if (restoreFocus) restoreFocus();
}

/**
 * A diff code cell. Long lines soft-wrap with a hanging indent: the continuation lines up under
 * the line's own indentation, and under the text of a "///" or "//" comment.
 */
function codeCell(text, cls, id) {
  const lead = /^[ \t]*(?:\/\/\/?[ \t]?)?/.exec(text || "")[0];
  const ind = Math.min(40, [...lead].reduce((n, ch) => n + (ch === "\t" ? 4 : 1), 0));
  return h("td", { class: cls, id, style: ind > 0 ? `--ind:${ind}ch` : null }, text);
}

function diffFile(f, split) {
  // The open-element column: lines that define an API element (source diffs only) get a button
  // that opens the element's page.
  const goCell = (line) => {
    const element = line && line.element && byId.owner[line.element] && line.element;
    const name = element && element.split("#").pop().replace("$", ".");
    return h("td", { class: "go" }, element && h("button", {
      class: "btn icon sm go-btn", title: `Open ${name}`, "aria-label": `Open ${name}`,
      onclick: () => go(byId.owner[element]),
    }, "→"));
  };
  const rowClass = (cls, line) => [cls, line && line.element && byId.owner[line.element] && "has-go"].filter(Boolean).join(" ");

  const rows = [];
  for (const hunk of f.hunks || []) {
    const header = `@@ -${hunk.oldStart},${hunk.oldCount} +${hunk.newStart},${hunk.newCount} @@`;
    rows.push(h("tr", { class: "hunk", tabindex: "-1" }, split
      ? [h("td", { class: "ln" }), h("td", { class: "sign" }), h("td", { colspan: "5" }, header)]
      : [h("td", { class: "ln old" }), h("td", { class: "ln new" }), h("td", { class: "sign" }), h("td", { colspan: "2" }, header)]));
    if (!split) {
      for (const line of hunk.lines) {
        const side = line.kind === "-" ? "baseline" : "current";
        const n = side === "baseline" ? line.old : line.new;
        rows.push(h("tr", {
          class: rowClass(line.kind === "+" ? "add" : line.kind === "-" ? "del" : "", line) || null,
          id: diffLineId(f.path, side, n), tabindex: "-1",
        },
          h("td", { class: "ln old" }, line.old || ""),
          // Narrow panes show this column only, so a deleted line shows its baseline number here.
          h("td", { class: "ln new" }, line.new || (line.old ? h("span", { class: "old-only" }, line.old) : "")),
          h("td", { class: "sign" }, line.kind === " " ? "" : line.kind),
          codeCell(line.text, "code"),
          goCell(line)));
      }
      continue;
    }
    // Split: baseline on the left, current on the right; a run of removed lines pairs with the
    // run of added lines after it, and context lines show on both sides.
    const half = (line, side) => {
      if (!line) return [h("td", { class: "ln" }), h("td", { class: "sign" }), h("td", { class: "code blank" })];
      const n = side === "baseline" ? line.old : line.new;
      const cls = line.kind === " " ? "" : side === "baseline" ? " del" : " add";
      return [h("td", { class: "ln" + cls }, n || ""), h("td", { class: "sign" + cls }, line.kind === " " ? "" : line.kind),
        codeCell(line.text, "code" + cls, diffLineId(f.path, side, n))];
    };
    const pair = (left, right) => {
      rows.push(h("tr", { class: rowClass("", right) || null, tabindex: "-1" },
        half(left, "baseline"), half(right, "current"), goCell(right)));
    };
    const lines = hunk.lines;
    for (let i = 0; i < lines.length;) {
      if (lines[i].kind !== "-" && lines[i].kind !== "+") { pair(lines[i], lines[i]); i++; continue; }
      const dels = [];
      const adds = [];
      while (i < lines.length && lines[i].kind === "-") dels.push(lines[i++]);
      while (i < lines.length && lines[i].kind === "+") adds.push(lines[i++]);
      for (let k = 0; k < Math.max(dels.length, adds.length); k++) pair(dels[k] || null, adds[k] || null);
    }
  }
  return h("details", {
    class: "diff-file", open: !state.ui.diffClosed[f.path],
    ontoggle: (e) => { state.ui.diffClosed[f.path] = !e.currentTarget.open; },
  },
    h("summary", { class: "diff-head" },
      h("span", { class: "path" }, f.path),
      f.added > 0 && h("span", { class: "plus" }, `+${f.added}`), f.removed > 0 && h("span", { class: "minus" }, `−${f.removed}`),
      h("span", { class: "aside" }, f.status === "modified" ? "baseline → current" : f.status)),
    h("div", { class: "diff-scroll" }, h("table", { class: "diff" + (split ? " split" : "") },
      // Fixed column widths for the split layout: line, sign, and code per side, then the open button.
      split && h("colgroup", {}, [0, 1].map(() => [h("col", { style: "width:48px" }), h("col", { style: "width:20px" }), h("col", {})]),
        h("col", { style: "width:32px" })),
      rows)),
    f.truncated && h("p", { class: "hint", style: "padding:6px 12px" }, "Diff truncated for size."));
}

/** Added, Changed, Removed, Breaking, and Danger counters. */
function changeStats() {
  const c = state.api.changes;
  const kinds = Object.values(c.entries || {});
  const breaking = (c.compatibility || []).filter((e) => e.breaking).length;
  const danger = (c.compatibility || []).filter((e) => e.danger).length;
  const stat = (n, label, cls) => h("div", { class: "stat" + (cls && n ? ` ${cls}` : "") }, h("div", { class: "n" }, n), h("div", { class: "l" }, label));
  return h("div", { class: "stat-row" },
    stat(kinds.filter((k) => k === "added").length, "Added"),
    stat(kinds.filter((k) => k === "changed").length, "Changed"),
    stat((c.removed || []).length, "Removed"),
    stat(breaking, "Breaking", "danger"),
    danger > 0 && stat(danger, "Danger", "warn"));
}

/** Main pane width from which the diff can show side by side. */
const SPLIT_MIN = 1100;

function splitFits() {
  const main = document.getElementById("main");
  return Boolean(main) && main.clientWidth >= SPLIT_MIN;
}

// The Changes page re-renders when the main pane crosses the split threshold, so the layout
// toggle appears or goes and an open split diff falls back to Unified (and back again).
const mainResize = new ResizeObserver(() => {
  const fits = splitFits();
  if (fits === mainResize.fits) return;
  const first = mainResize.fits === undefined;
  mainResize.fits = fits;
  if (!first && state.rendered && state.view.kind === "changes") rerenderMain();
});

function changesReference() {
  const c = state.api.changes;
  const files = c.files || [];
  const added = files.reduce((n, f) => n + f.added, 0);
  const removed = files.reduce((n, f) => n + f.removed, 0);
  const events = c.compatibility || [];
  const breaking = events.filter((e) => e.breaking);
  const danger = events.filter((e) => e.danger);
  const others = events.filter((e) => !e.breaking && !e.danger);
  // Split needs room for two columns of source; the toggle only shows on a wide main pane, and a
  // narrower pane (a resize) shows Unified until it is wide again.
  const fits = splitFits();
  const split = state.ui.diffSplit && fits;
  const mode = (key, label) => h("button", {
    role: "radio", "aria-checked": String(split === (key === "split")), tabindex: split === (key === "split") ? "0" : "-1",
    onclick: () => { state.ui.diffSplit = key === "split"; rerenderMain(); }, onkeydown: radioKeys,
  }, label);
  return [
    // Each item carries its "·" (.bi::before), so a wrapped line never starts with a separator.
    pageHeader({ title: "Changes",
      sub: h("div", { class: "binding-row" },
        h("span", { class: "bi" }, baselineLabel()),
        h("span", { class: "bi" }, `${files.length} file${files.length === 1 ? "" : "s"} changed`),
        (added > 0 || removed > 0) && h("span", { class: "bi" },
          added > 0 && h("span", { style: "color:var(--ok)" }, `+${added}`), removed > 0 && h("span", { style: "color:var(--danger)" }, `−${removed}`)),
        changeSummaryParts().map((part) => h("span", { class: "bi" }, part))) }),
    changeStats(),
    // Static page content, so a labelled region rather than role=alert, which would interrupt
    // screen readers on every render; role=alert stays for problems that need attention.
    breaking.length > 0 && quietAlert(alertBox("error", `Breaking changes (${breaking.length})`, h("div", {}, compatibilityList(breaking)))),
    dangerAlert(danger),
    h("h2", {}, "API elements"),
    h("div", { class: "change-groups" }, changeList(0)),
    h("div", { class: "files-head" },
      h("h2", {}, `Files (${files.length})`),
      files.length > 0 && fits && h("div", { class: "seg diff-mode", role: "radiogroup", "aria-label": "Diff layout" },
        mode("unified", "Unified"), mode("split", "Split"))),
    c.diffMode === "normalized" && alertBox("info", "Normalized diff",
      "The baseline is not IDL source, so both models are shown serialized to IDL (SmithyIdlModelSerializer). "
      + "Line numbers refer to that normalized form."),
    files.length === 0 && h("p", { class: "hint" }, "No source changes since the baseline."),
    files.map((f) => diffFile(f, split)),
    h("h2", {}, breaking.length || danger.length ? `Other compatibility events (${others.length})` : `Compatibility (${events.length})`),
    others.length > 0 || events.length === 0 ? otherCompatibility(others)
      : h("p", { class: "hint" }, breaking.length ? "Only the changes above." : "Only the danger changes above."),
  ];
}

/** Arrow keys move between the radios of a segmented control and select. */
function radioKeys(e) {
  if (!["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.key)) return;
  e.preventDefault();
  const group = e.currentTarget.closest('[role="radiogroup"]');
  const label = group.getAttribute("aria-label");
  const radios = [...group.querySelectorAll('[role="radio"]')];
  const at = radios.indexOf(e.currentTarget);
  const next = (at + (e.key === "ArrowRight" || e.key === "ArrowDown" ? 1 : radios.length - 1)) % radios.length;
  radios[next].click();
  // The click re-renders the control; focus the new radio at the same position.
  const fresh = document.querySelectorAll(`[role="radiogroup"][aria-label="${label}"] [role="radio"]`)[next];
  if (fresh) fresh.focus();
}

/** Text with a break opportunity after each "/", so a path wraps between segments, not inside ":128". */
function slashBreaks(text) {
  return String(text).split(/(?<=\/)/).flatMap((part, i) => (i > 0 ? [h("wbr"), part] : [part]));
}

/** "smooth", or "auto" when the user asks for reduced motion. */
function scrollBehavior() {
  return matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";
}

/** The keyboard shortcut list, as a modal dialog built on first use. */
function showShortcuts() {
  let dlg = document.getElementById("shortcuts");
  if (!dlg) {
    const row = (keys, text) => [h("dt", {}, keys.map((k) => h("kbd", {}, k))), h("dd", {}, text)];
    dlg = h("dialog", { id: "shortcuts", class: "modal", "aria-labelledby": "shortcuts-title" },
      h("form", { method: "dialog" },
        h("h2", { id: "shortcuts-title" }, "Keyboard shortcuts"),
        h("dl", { class: "shortcut-list" },
          Object.values(SHORTCUTS).filter((x) => x.keys).map((x) => row(x.keys, x.text))),
        h("div", { class: "actions" }, h("button", { class: "btn", value: "close" }, "Close"))));
    dlg.addEventListener("close", () => { if (dlg._return && dlg._return.isConnected) dlg._return.focus(); });
    document.body.append(dlg);
  }
  dlg._return = document.activeElement;
  if (!dlg.open) dlg.showModal();
}

function focusSearch(select) {
  const bar = document.getElementById("find-bar");
  let find = bar && bar.offsetParent !== null ? bar : document.getElementById("find");
  if (!find) {
    // Phones search from the Search page, which has its own field.
    go({ kind: "search" }, { focus: false });
    find = document.getElementById("find");
  }
  if (!find) return;
  find.focus();
  if (select) find.select(); else find.setSelectionRange(find.value.length, find.value.length);
}

/** Steps to the previous or next operation in navigation order. */
function stepOperation(delta) {
  const ops = state.api.operations;
  if (ops.length === 0) return;
  const at = state.view.kind === "operation" ? ops.findIndex((o) => o.id === state.view.id) : (delta > 0 ? -1 : 0);
  const next = ops[(at + delta + ops.length) % ops.length];
  go({ kind: "operation", id: next.id });
}

/**
 * Moves to the next or previous hunk on Changes, or the next or previous changed member row on
 * other pages: from the focused target, or else from the top of the visible pane.
 */
function stepTarget(delta) {
  const onChanges = state.view.kind === "changes";
  const targets = [...document.querySelectorAll(onChanges ? "#main-inner details[open] tr.hunk"
    : "#main-inner .member-row.added, #main-inner .member-row.changed")];
  if (targets.length === 0) { toast(onChanges ? "No hunks to step through" : "No changed rows on this page"); return; }
  let at = targets.indexOf(document.activeElement);
  if (at >= 0) {
    at = Math.min(Math.max(at + delta, 0), targets.length - 1);
  } else {
    const main = document.getElementById("main");
    const top = (innerWidth >= PHONE && main ? main.getBoundingClientRect().top : document.getElementById("bar").getBoundingClientRect().bottom) + 48;
    const tops = targets.map((t) => t.getBoundingClientRect().top);
    at = delta > 0 ? tops.findIndex((y) => y > top + 4) : tops.map((y) => y < top - 4).lastIndexOf(true);
    if (at < 0) at = delta > 0 ? targets.length - 1 : 0;
  }
  const t = targets[at];
  t.focus({ preventScroll: true });
  t.scrollIntoView({ block: onChanges ? "start" : "center" });
  if (!onChanges) {
    t.classList.remove("flash");
    void t.offsetWidth;
    t.classList.add("flash");
  }
}

// Single-key shortcuts. Keys with a "g" prefix are two-key sequences.

const SHORTCUTS = {
  "/": { keys: ["/"], text: "Search the API", run: () => focusSearch(true) },
  "g o": { keys: ["g", "o"], text: "Go to the overview", run: () => go({ kind: "service" }) },
  "g c": { keys: ["g", "c"], text: "Go to changes", run: () => state.api.changes && go({ kind: "changes" }) },
  "g v": { keys: ["g", "v"], text: "Go to validation", run: () => go({ kind: "validation" }) },
  "[": { keys: ["["], text: "Previous operation", run: () => stepOperation(-1) },
  "]": { keys: ["]"], text: "Next operation", run: () => stepOperation(1) },
  "j": { keys: ["j"], text: "Next hunk (Changes) or next changed row", run: () => stepTarget(1) },
  "k": { keys: ["k"], text: "Previous hunk (Changes) or previous changed row", run: () => stepTarget(-1) },
  "t": { keys: ["t"], text: "Switch between light and dark", run: () => toggleTheme() },
  "?": { keys: ["?"], text: "Show keyboard shortcuts", run: () => showShortcuts() },
};

let pendingPrefix = null;
addEventListener("keydown", (e) => {
  if (!state.rendered) return;
  const active = document.activeElement || document.body;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName) || active.isContentEditable;
  // Open dialogs handle their own keys; Escape closes them natively.
  if (document.querySelector("dialog[open]")) return;
  if (e.key === "Escape") {
    if (document.getElementById("more-menu")) {
      toggleMenu(false);
      document.getElementById("more-button").focus();
      return;
    }
    if (active.id === "find" || active.id === "find-bar") {
      if (active.value) { active.value = ""; onSearchInput(""); } else active.blur();
      return;
    }
    // Escape in the example request editor stays in the editor.
    if (active.tagName === "TEXTAREA" && active.value) return;
    if (closeDrawers()) e.preventDefault();
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    focusSearch(true);
    return;
  }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  let key = e.key;
  if (pendingPrefix && Date.now() - pendingPrefix < 1000) key = `g ${e.key}`;
  pendingPrefix = null;
  if (key === "g") { pendingPrefix = Date.now(); return; }
  const shortcut = SHORTCUTS[key];
  if (!shortcut) return;
  e.preventDefault();
  shortcut.run(e);
});

document.getElementById("skip").addEventListener("click", (e) => {
  e.preventDefault();
  const main = document.getElementById("main");
  if (main) main.focus();
});

// ── Documentation rendering ───────────────────────────────────────────────────────────────────

const ALLOWED_TAGS = new Set(["P", "CODE", "PRE", "B", "STRONG", "I", "EM", "UL", "OL", "LI", "BR", "DL", "DT", "DD", "A"]);

function docs(text, compact) {
  if (!text) return compact ? null : h("p", { class: "docs empty" }, "No documentation. Customers will see an empty description.");
  const el = h("div", { class: "docs" });
  if (/<[a-z][\s\S]*>/i.test(text)) {
    const parsed = new DOMParser().parseFromString(text, "text/html");
    el.append(...sanitize(parsed.body.childNodes));
  } else {
    el.append(...markdownLite(text));
  }
  return el;
}

/** Rebuilds documentation HTML from an allowlist of tags; everything else becomes text. */
function sanitize(nodes) {
  const out = [];
  for (const node of nodes) {
    if (node.nodeType === Node.TEXT_NODE) {
      out.push(document.createTextNode(node.textContent));
    } else if (node.nodeType === Node.ELEMENT_NODE) {
      const children = sanitize(node.childNodes);
      if (ALLOWED_TAGS.has(node.tagName)) {
        if (node.tagName === "A") {
          const href = node.getAttribute("href") || "";
          out.push(/^https?:\/\//i.test(href)
            ? h("a", { href, target: "_blank", rel: "noopener noreferrer" }, children)
            : h("span", {}, children));
        } else {
          out.push(h(node.tagName.toLowerCase(), {}, children));
        }
      } else {
        out.push(...children);
      }
    }
  }
  return out;
}

/** Paragraphs, bullet lists, `code`, and **bold**; the subset of CommonMark Smithy docs use most. */
function markdownLite(text) {
  const blocks = text.trim().split(/\n\s*\n/);
  return blocks.map((block) => {
    const lines = block.split("\n");
    if (lines.every((l) => /^\s*[-*]\s+/.test(l))) {
      return h("ul", {}, lines.map((l) => h("li", {}, inline(l.replace(/^\s*[-*]\s+/, "")))));
    }
    return h("p", {}, inline(block.replace(/\n/g, " ")));
  });
}

function inline(text) {
  const parts = [];
  const re = /(`[^`]+`|\*\*[^*]+\*\*)/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) parts.push(text.slice(last, m.index));
    parts.push(m[0].startsWith("`") ? h("code", {}, m[0].slice(1, -1)) : h("strong", {}, m[0].slice(2, -2)));
    last = re.lastIndex;
  }
  parts.push(text.slice(last));
  return parts;
}

function summaryOf(text) {
  if (!text) return h("span", { class: "docs empty" }, "Undocumented");
  const plain = new DOMParser().parseFromString(text, "text/html").body.textContent.trim();
  const first = plain.split(/(?<=\.)\s/)[0];
  return first.length > 160 ? first.slice(0, 157) + "…" : first;
}

function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
